<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasaportes - República de Como</title>
    <style>
        :root { --primary: #1e3a8a; --accent: #d97706; --bg: #f3f4f6; --surface: #fff; --text: #1f2937; --border: #e5e7eb; --danger: #dc2626; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        
        header { background: linear-gradient(to right, #172554, var(--primary)); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .brand h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }
        .user-badge { background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        
        .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; width: 100%; flex: 1; }
        .card { background: var(--surface); border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        
        .auth-box { max-width: 400px; margin: 3rem auto; }
        .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 1.5rem; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: 600; color: #6b7280; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        
        .field { margin-bottom: 1rem; }
        .field label { display: block; font-size: 0.8rem; font-weight: 700; color: #6b7280; text-transform: uppercase; margin-bottom: 4px; }
        .field input, .field select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; }
        .field input:focus { outline: none; border-color: var(--primary); }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-accent { background: var(--accent); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: #6b7280; width: auto; padding: 8px 16px; }
        
        .hidden { display: none !important; }
        .msg { padding: 10px; border-radius: 8px; margin-bottom: 1rem; text-align: center; font-size: 0.9rem; }
        .msg-error { background: #fee2e2; color: var(--danger); }
        .msg-success { background: #dcfce7; color: #166534; }
        .msg-loading { background: #dbeafe; color: #1e40af; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
        th { text-align: left; padding: 10px; background: #f8fafc; border-bottom: 2px solid var(--border); color: #6b7280; }
        td { padding: 10px; border-bottom: 1px solid var(--border); }
        .badge { padding: 3px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .badge-ok { background: #dcfce7; color: #166534; }
        .badge-bad { background: #fee2e2; color: #991b1b; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        
        @media(max-width:600px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header id="hdr" class="hidden">
        <div class="brand"><h1>🛂 REPÚBLICA DE COMO</h1></div>
        <div class="user-badge" onclick="doLogout()"><span id="usrName">User</span> ⏻</div>
    </header>

    <div class="container">
        <!-- AUTH -->
        <div id="authView" class="card auth-box">
            <div style="text-align:center; margin-bottom:1.5rem;">
                <div style="font-size:2.5rem;">🛂</div>
                <h2>Sistema de Identidad</h2>
            </div>
            
            <div class="tabs">
                <div class="tab active" onclick="setTab('login')">Entrar</div>
                <div class="tab" onclick="setTab('reg')">Registro</div>
            </div>

            <form id="frmLogin">
                <div class="field"><label>Usuario / Email</label><input id="lUser" required></div>
                <div class="field"><label>Contraseña</label><input type="password" id="lPass" required></div>
                <button type="submit" class="btn btn-primary">ACCEDER AL SISTEMA</button>
                <div id="lErr" class="msg msg-error hidden"></div>
            </form>

            <form id="frmReg" class="hidden">
                <div class="field"><label>Nombre Completo</label><input id="rName" required></div>
                <div class="field"><label>Email</label><input type="email" id="rEmail" required></div>
                <div class="field"><label>Contraseña</label><input type="password" id="rPass" required minlength="4"></div>
                <button type="submit" class="btn btn-accent">CREAR CUENTA CIUDADANA</button>
                <div id="rErr" class="msg msg-error hidden"></div>
            </form>
        </div>

        <!-- ADMIN -->
        <div id="adminView" class="hidden">
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                    <h2>Base de Datos Nacional</h2>
                    <button onclick="loadData()" class="btn btn-outline">🔄 Refrescar</button>
                </div>
                <div id="loadingMsg" class="msg msg-loading hidden">Cargando datos de Google Sheets...</div>
                <div style="overflow-x:auto;">
                    <table><thead><tr><th>DNI</th><th>Ciudadano</th><th>Pasaporte</th><th>Vence</th><th>Estado</th></tr></thead>
                    <tbody id="admTbody"></tbody></table>
                </div>
                <p id="admEmpty" class="hidden" style="text-align:center; padding:2rem; color:#999;">Sin registros.</p>
            </div>
        </div>

        <!-- CITIZEN -->
        <div id="citView" class="hidden">
            <div class="card">
                <h2 style="margin-bottom:1rem;">Solicitud de Pasaporte</h2>
                <div id="citOk" class="msg msg-success hidden">✅ Registrado correctamente en Google Sheets</div>
                
                <div style="background:#f8fafc; padding:1rem; border-radius:8px; margin-bottom:1.5rem; border-left:4px solid var(--accent);">
                    <button type="button" id="rndBtn" class="btn btn-accent" style="width:auto; padding:6px 12px; font-size:0.85rem;">🎲 Generar Nº Pasaporte</button>
                </div>

                <form id="frmPass">
                    <div class="grid-2">
                        <div class="field"><label>DNI *</label><input id="pDni" required></div>
                        <div class="field"><label>Nº Pasaporte *</label><input id="pNum" required placeholder="Usa el botón 🎲"></div>
                        <div class="field"><label>Nombre *</label><input id="pNom" required></div>
                        <div class="field"><label>Apellidos *</label><input id="pApe" required></div>
                        <div class="field"><label>F. Nacimiento *</label><input type="date" id="pNac" required></div>
                        <div class="field"><label>Lugar Nacimiento *</label><input id="pLug" required></div>
                        <div class="field"><label>Sexo *</label><select id="pSex" required><option value="">...</option><option value="M">Masculino</option><option value="F">Femenino</option><option value="O">Otro</option></select></div>
                        <div class="field"><label>Nacionalidad</label><input value="Como" readonly style="background:#eee;"></div>
                        <div class="field"><label>F. Expedición *</label><input type="date" id="pExp" required></div>
                        <div class="field"><label>F. Vencimiento *</label><input type="date" id="pVen" required></div>
                    </div>
                    <div style="margin-top:1.5rem; text-align:right;">
                        <button type="submit" class="btn btn-primary" style="width:auto; padding:10px 24px;" id="saveBtn">💾 REGISTRAR PASAPORTE</button>
                    </div>
                    <div id="pErr" class="msg msg-error hidden" style="margin-top:1rem;"></div>
                </form>
            </div>
        </div>
    </div>

<script>
// ==========================================
// CONFIGURACIÓN - TU URL INTEGRADA
// ==========================================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzFv6s9jg0vCt0jiixZrHYK2FoyD4F5dSdhzFv4_-43T3io3ujteOGiVu9utc5slhP9qA/exec';

// ==========================================
// ESTADO Y UTILIDADES
// ==========================================
let currentUser = null;
let pData = [];

function $(id) { return document.getElementById(id); }
function hideAll() { $('authView').classList.add('hidden'); $('adminView').classList.add('hidden'); $('citView').classList.add('hidden'); $('hdr').classList.add('hidden'); }

// Base de datos local de usuarios (solo para login)
let localUsers = JSON.parse(localStorage.getItem('como_users_gapps') || '[]');
if (!localUsers.find(u => u.u === 'root')) {
    localUsers.push({ u: 'root', p: 'root', n: 'Administrador', r: 'admin' });
    localStorage.setItem('como_users_gapps', JSON.stringify(localUsers));
}

// ==========================================
// INICIO
// ==========================================
function init() {
    sessionStorage.clear();
    currentUser = null;
    hideAll();
    $('authView').classList.remove('hidden');
    $('lUser').value = '';
    $('lPass').value = '';
    $('lErr').classList.add('hidden');
}

// ==========================================
// LOGIN
// ==========================================
$('frmLogin').addEventListener('submit', function(e) {
    e.preventDefault();
    const u = $('lUser').value.trim();
    const p = $('lPass').value.trim();
    
    const found = localUsers.find(x => (x.u === u || x.e === u) && x.p === p);
    
    if (found) {
        currentUser = found;
        enterSystem();
    } else {
        $('lErr').textContent = '❌ Usuario o contraseña incorrectos';
        $('lErr').classList.remove('hidden');
    }
});

// ==========================================
// REGISTRO LOCAL
// ==========================================
$('frmReg').addEventListener('submit', function(e) {
    e.preventDefault();
    const n = $('rName').value.trim();
    const em = $('rEmail').value.trim();
    const pw = $('rPass').value.trim();
    
    if (localUsers.find(x => x.e === em)) {
        $('rErr').textContent = '❌ Email ya registrado';
        $('rErr').classList.remove('hidden');
        return;
    }
    
    localUsers.push({ u: em, e: em, p: pw, n: n, r: 'citizen' });
    localStorage.setItem('como_users_gapps', JSON.stringify(localUsers));
    
    alert('✅ Cuenta creada. Inicia sesión.');
    setTab('login');
    $('lUser').value = em;
    $('rErr').classList.add('hidden');
});

function setTab(t) {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    event.target.classList.add('active');
    $('frmLogin').classList.toggle('hidden', t !== 'login');
    $('frmReg').classList.toggle('hidden', t !== 'reg');
    $('lErr').classList.add('hidden');
    $('rErr').classList.add('hidden');
}

// ==========================================
// ENTRAR AL SISTEMA
// ==========================================
function enterSystem() {
    hideAll();
    $('hdr').classList.remove('hidden');
    $('usrName').textContent = currentUser.n + (currentUser.r === 'admin' ? ' 👑' : '');
    
    if (currentUser.r === 'admin') {
        $('adminView').classList.remove('hidden');
        loadData();
    } else {
        $('citView').classList.remove('hidden');
        setDates();
    }
}

function doLogout() { init(); }

// ==========================================
// GENERADOR PASAPORTE
// ==========================================
$('rndBtn').addEventListener('click', () => {
    $('pNum').value = 'COMO-' + Math.floor(100000 + Math.random() * 900000);
});

function setDates() {
    const t = new Date().toISOString().split('T')[0];
    const v = new Date(new Date().setFullYear(new Date().getFullYear()+10)).toISOString().split('T')[0];
    $('pExp').value = t;
    $('pVen').value = v;
}

// ==========================================
// CREAR PASAPORTE (APPS SCRIPT)
// ==========================================
$('frmPass').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = $('saveBtn');
    btn.disabled = true; btn.textContent = '⏳ Guardando...';
    $('pErr').classList.add('hidden');
    
    try {
        const response = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', // Importante para evitar errores CORS con Apps Script
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'create',
                dni: $('pDni').value.trim(),
                nombre: $('pNom').value.trim(),
                apellidos: $('pApe').value.trim(),
                fechaNacimiento: $('pNac').value,
                lugarNacimiento: $('pLug').value.trim(),
                nacionalidad: 'Como',
                sexo: $('pSex').value,
                fechaExpedicion: $('pExp').value,
                fechaVencimiento: $('pVen').value,
                numeroPasaporte: $('pNum').value.trim()
            })
        });
        
        // Con no-cors asumimos éxito si no hay error de red
        $('citOk').classList.remove('hidden');
        e.target.reset(); setDates();
        setTimeout(() => $('citOk').classList.add('hidden'), 3000);
    } catch(err) {
        $('pErr').textContent = '❌ Error de conexión: ' + err.message;
        $('pErr').classList.remove('hidden');
    } finally {
        btn.disabled = false; btn.textContent = '💾 REGISTRAR PASAPORTE';
    }
});

// ==========================================
// LEER DATOS (APPS SCRIPT)
// ==========================================
async function loadData() {
    const tb = $('admTbody');
    const loadMsg = $('loadingMsg');
    tb.innerHTML = '';
    loadMsg.classList.remove('hidden');
    
    try {
        const response = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'read' })
        });
        
        const json = await response.json();
        pData = json.data || [];
        renderTable(pData);
    } catch(err) {
        tb.innerHTML = `<tr><td colspan="5" style="text-align:center;color:red;">Error: ${err.message}<br>Verifica la URL de Apps Script</td></tr>`;
    } finally {
        loadMsg.classList.add('hidden');
    }
}

function renderTable(d) {
    const tb = $('admTbody');
    const emp = $('admEmpty');
    if (!d.length) { tb.innerHTML=''; emp.classList.remove('hidden'); return; }
    emp.classList.add('hidden');
    
    tb.innerHTML = d.map(p => {
        const exp = new Date(p['Fecha Vencimiento']) < new Date();
        return `<tr>
            <td style="font-family:monospace;font-weight:700;">${p.DNI}</td>
            <td>${p.Nombre} ${p.Apellidos}</td>
            <td style="font-family:monospace;">${p['Numero Pasaporte']}</td>
            <td>${new Date(p['Fecha Vencimiento']).toLocaleDateString('es-ES')}</td>
            <td><span class="badge ${exp?'badge-bad':'badge-ok'}">${exp?'VENCIDO':'ACTIVO'}</span></td>
        </tr>`;
    }).join('');
}

// ==========================================
// ARRANCAR
// ==========================================
init();
</script>
</body>
</html>
